[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dks"
version = "0.3.0"
description = "Dynamic Key-State Encryption: research prototype"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "nistrng>=1.2", "numpy", "scipy", "ruff", "mypy", "bandit"]

[tool.setuptools]
py-modules = ["dks", "sp800_22", "sp800_22_run"]
